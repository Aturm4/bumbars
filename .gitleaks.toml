title = "Repository secret protection"
minVersion = "v8.30.1"

[extend]
useDefault = true

# Reviewed SQL migration marker; not an API credential.
[[rules]]
id = "generic-api-key"
[[rules.allowlists]]
description = "Exact economy migration metadata key in the server SQL query"
condition = "AND"
paths = ['(^|[\\/])lib[\\/]server[\\/]game\.ts$']
regexTarget = "secret"
regexes = ['^economy-usd-v1$']
